<!DOCTYPE html>
<html lang="ko">

<head>
  <title>(pagelist)장영하 포트폴리오</title>
  @@include('@@webRoot/html/_include/_head.html')
  <style>
    body {
      padding: 20px;
      position: relative;
    }

    * {
      margin: 0;
      padding: 0;
      font-size: 12px;
      color: #222;
      line-height: 1.5em;
      font-family: 'NanumGothic';
    }

    h1 {
      margin-bottom: 20px;
      font-size: 24px;
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 0 auto;
    }

    table th,
    table td {
      border: 1px solid #7992b9;
      padding: 2px 10px;
      word-break: keep-all
    }

    table th {
      background: #283c5d;
      color: #fff;
      padding: 10px;
      font-size: 14px;
    }

    table td a {
      color: #283c5d;
      text-decoration: none;
    }

    table td a:hover {
      text-decoration: underline;
    }

    table tbody tr:hover {
      background-color: #ecf8fc;
    }

    .noteTable {
      display: table;
      width: 100%;
    }

    .noteTable .date {
      display: table-cell;
      color: #ff523c;
      width: 40px;
    }

    .noteTable .note {
      display: table-cell;
    }

    .center {
      text-align: center;
    }

    .bg {
      background: #fff5f5;
    }

    ul.float {
      position: absolute;
      right: 20px;
      top: 20px;
    }

    ul.float li {
      list-style: none;
      border: 1px solid #ccc;
      padding: 2px 5px;
      display: inline-block;
    }

    .end {
      background: #ffffcc;
    }

    .ing {
      background: #f6b1a6;
    }

    .list {
      text-align: center;
      padding: 0 0 20px;
    }

    .list a {
      text-decoration: none;
      margin: 0 10px;
    }

    .list a:hover {
      text-decoration: underline;
    }

    .box {
      border: 2px dotted #aaa;
      padding: 1rem;
      margin-bottom: 1rem;
      text-align: center;
      line-height: 1.6;
    }

    .box>ul {
      display: inline-block;
      text-align-last: left;
    }
  </style>
</head>
